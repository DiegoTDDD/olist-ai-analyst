[project]
name = "olist-ai-analyst"
version = "1.0.0"
description = "A local-model data analyst that turns a business question into a decision memo with checked SQL, over the real Olist marketplace data."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["duckdb>=1.4,<2", "ollama>=0.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["analyst*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["E402"]
